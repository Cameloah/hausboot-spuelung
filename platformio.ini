; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The default partition table is kept on purpose: an update over WiFi cannot change the table
; on a device that is already installed.

; Upload over WiFi: enter the device's host name or IP address and remove the semicolons.
; upload_protocol = espota
; upload_port = klo-kalle.fritz.box

lib_deps =
    https://github.com/Cameloah/ProjectUtils-esp32.git#v2.4.0
